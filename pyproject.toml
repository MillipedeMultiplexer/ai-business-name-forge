[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-business-name-forge"
version = "0.4.2"
description = "AI-powered business name generator for founders who can't name things"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "forge-labs", email = "team@forge-labs.dev" }]
keywords = ["naming", "ai", "branding", "startup", "generator"]
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12,<0.14",
    "rich>=13.7,<14",
    "httpx>=0.27,<0.29",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "pre-commit>=3.7",
]
llm = [
    "llama-cpp-python>=0.2.80",
    "sentencepiece>=0.2.0",
]

[project.scripts]
forge = "forge_app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["forge_app", "forge_core", "forge_handlers", "forge_services",
            "forge_models", "forge_adapters", "forge_utils"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["forge_core", "forge_services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=forge_core --cov=forge_services --cov-report=term-missing"